  <script src="/atmos-offline.js"></script>
  <script type="module" src="/assets/index-DzR8kFx2.js?v=10"></script>

</head>

<body>
  <div id="root">
    <!-- Visible boot fallback: React replaces this immediately; it prevents an unexplained black screen if a cached asset or network request fails. -->
    <div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#f8fafc;font-family:Inter,Arial,sans-serif;text-align:center;padding:24px">
      <div><div style="font-size:22px;font-weight:900;letter-spacing:.28em;font-style:italic">ATMOS</div><div id="boot-status" style="margin-top:14px;color:#94a3b8;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Starting atmospheric telemetry…</div><div style="margin:18px auto 0;width:34px;height:34px;border:2px solid rgba(255,255,255,.12);border-top-color:#f27d26;border-radius:50%;animation:atmos-boot-spin 1s linear infinite"></div></div>
    </div>
  </div>

  <!-- A lightweight companion lives outside React so it remains available during loading/offline mode. -->
  <aside id="atmos-companion" class="night" aria-label="Atmos weather companion" title="Click me for a weather update">
    <div class="companion-card">
      <div class="companion-scene" aria-hidden="true">
        <span class="stars"></span><span class="sparkles">✦</span><span class="sun-orb"></span>
        <span class="shadow"></span><span class="cloud"><span class="face">•ᴗ•</span></span>
        <span class="rain-drops"><i></i><i></i><i></i></span>
      </div>
      <div class="companion-status">Weather buddy</div>
      <div class="companion-message" role="status">Checking the sky for you…</div>
    </div>
  </aside>
  <script>
    (() => {
      // --- Robust boot error handling: only show fatal error if React hasn't mounted after a grace period ---
      let bootErrorSeen = null;
      const getBoot = () => document.getElementById('boot-status');
      const getFallback = () => document.getElementById('boot-fallback');
      const hasHeader = () => !!document.getElementById('root')?.querySelector('header');

      const showBootError = (label, err, opts = {}) => {
        const boot = getBoot();
        const fallback = getFallback();
        if (!boot) return;
        if (hasHeader()) return; // React already mounted, ignore
        // For resource errors (CSS), don't treat as fatal unless JS also failed
        if (opts.isResource) {
          const tag = err && err.tagName;
          const src = err && (err.src || err.href) || '';
          // Only treat JS module failures as fatal; CSS failures are non-fatal
          if (tag === 'LINK' || (src && src.endsWith('.css'))) {
            console.warn('[ATMOS] non-fatal resource warning:', label, src);
            return;
          }
        }
        const details = (err && (err.message || err.reason || err.stack || err)) ? String(err.message || err.reason || err.stack || err).slice(0, 600) : '';
        const srcInfo = err && err.filename ? ` @ ${String(err.filename).split('/').pop()}:${err.lineno||'?'}:${err.colno||'?'}` : '';
        console.error('[ATMOS boot error]', label, err);
        bootErrorSeen = { label, details: details + srcInfo, time: Date.now() };

        // Only immediately show error for JS errors; for other cases wait for timeout
        const isJsError = (err && err.tagName === 'SCRIPT') || label.toLowerCase().includes('script') || label.toLowerCase().includes('startup');
        if (isJsError || opts.force) {
          boot.textContent = 'Unable to start telemetry — please refresh';
          if (fallback && !document.getElementById('boot-error-details')) {
            const d = document.createElement('div');
            d.id = 'boot-error-details';
            d.style.cssText = 'margin-top:14px;max-width:560px;color:#f87171;font-size:11px;letter-spacing:0;text-transform:none;white-space:pre-wrap;word-break:break-word;text-align:left;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);padding:12px 14px;border-radius:12px;line-height:1.5';
            const retryBtn = `<button onclick=\"localStorage.clear();sessionStorage.clear();if('caches' in window){caches.keys().then(k=>k.forEach(n=>caches.delete(n)))};location.reload(true)\" style=\"margin-top:10px;padding:8px 14px;background:#fff;color:#000;border:0;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer\">Hard refresh & clear cache</button>`;
            d.innerHTML = `<div><strong>${label}</strong>${srcInfo ? ' '+srcInfo : ''}</div><div style=\"margin-top:6px;opacity:.9\">${details || 'Unknown startup error'}</div><div style=\"margin-top:8px;opacity:.7\">Open console (F12) for full stack. This can happen if a previous service-worker cached a broken bundle.</div>${retryBtn}`;
            const container = fallback.firstElementChild;
            if (container) container.appendChild(d);
          }
        }
      };

      window.addEventListener('error', event => {
        // Ignore errors that are already handled or non-fatal
        if (event.target && (event.target.tagName === 'LINK' || event.target.tagName === 'IMG')) return;
        showBootError('Startup error', event.error || event.message || event, { force: false });
      });
      window.addEventListener('unhandledrejection', event => {
        showBootError('Telemetry promise error', event.reason || event, { force: false });
      });
      // Resource error listener - only for SCRIPT tags (JS), not CSS
      window.addEventListener('error', event => {
        const t = event.target;
        if (t && t.tagName === 'SCRIPT') {
          const src = t.src || 'unknown';
          showBootError('Script failed to load', t, { isResource: true, force: true });
        }
      }, true);

      // Final safety net: if after 8s header still not present, show error with whatever we captured
      setTimeout(() => {
        if (hasHeader()) return;
        const boot = getBoot();
        if (!boot) return;
        if (bootErrorSeen) {
          showBootError(bootErrorSeen.label, bootErrorSeen.details, { force: true });
        } else {
          // No specific error captured, but React didn't mount - likely module failed silently
          showBootError('Telemetry init timeout', 'React did not mount within 8s. This often means the JS bundle was cached as HTML by an old service-worker or blocked by an extension.', { force: true });
        }
      }, 8000);
      const buddy = document.getElementById('atmos-companion');
      const message = buddy.querySelector('.companion-message');
      const status = buddy.querySelector('.companion-status');
      const defaultLocation = { lat: 33.5984, lon: 73.0441, name: 'Rawalpindi' };
      const moods = {
        hot: ['I am melting a little! Drink water and find some shade.', 'Too much sunshine! SPF and water, please.'],
        cold: ['Brrr… I brought you a tiny warm cloud. Layer up!', 'Cold air detected. Keep your hands warm today.'],
        rain: ['Drip, drop! Grab an umbrella before you head out.', 'Rain mode activated. Cozy weather for a warm drink.'],
        clear: ['The sky is looking lovely. Have a bright day!', 'Clear skies! I am ready for an adventure.'],
        night: ['The stars are out. Rest well and stay cozy.', 'Night mode: soft clouds and quiet skies.']
      };
      let lastMood = 'night';
      let messageIndex = 0;
      const setMood = (mood, text) => {
        ['hot','cold','rain','clear','night'].forEach(c => buddy.classList.toggle(c, c === mood));
        lastMood = mood;
        status.textContent = mood === 'night' ? 'Night companion' : 'Weather buddy';
        message.textContent = text || moods[mood][messageIndex++ % moods[mood].length];
      };
      const location = () => { try { return Object.assign({}, defaultLocation, JSON.parse(localStorage.getItem('atmos_selected_location') || '{}')); } catch { return defaultLocation; } };
      async function updateWeather() {
        const place = location();
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`;
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error('weather unavailable');
          const current = (await response.json()).current;
          const code = Number(current.weather_code), temp = Number(current.temperature_2m);
          const night = Number(current.is_day) === 0;
          const rainy = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code);
          const mood = night ? 'night' : rainy ? 'rain' : temp >= 32 ? 'hot' : temp <= 10 ? 'cold' : 'clear';
          setMood(mood, `${place.name}: ${moods[mood][messageIndex++ % moods[mood].length]}`);
        } catch { setMood(lastMood, 'I am here even when the satellite link is shy.'); }
      }
      buddy.addEventListener('click', () => { setMood(lastMood, 'Thanks for checking in! I am watching the sky for you.'); updateWeather(); });
      document.addEventListener('click', event => { if (!buddy.contains(event.target)) setMood(lastMood, 'I saw that! Let us keep exploring the forecast.'); }, { passive: true });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') setMood(lastMood, 'All calm here. Take your time.'); });
      updateWeather(); setInterval(updateWeather, 10 * 60 * 1000);
    })();
  </script>
</body>

</html>
